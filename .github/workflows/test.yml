name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [release, sanitized]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build release
        if: matrix.build == 'release'
        run: make -j2 linux
      - name: Build with assertions and sanitizers
        if: matrix.build == 'sanitized'
        run: >-
          make -j2 linux
          MYCFLAGS="-O1 -g -DLUAI_ASSERT -DHARDSTACKTESTS -DHARDMEMTESTS -fsanitize=address,undefined -fno-omit-frame-pointer"
          MYLDFLAGS="-fsanitize=address,undefined"
      - name: Run regressions and examples
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: make test
      - name: Check stripped bytecode and disassembly
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          ./src/luac -s -o "$RUNNER_TEMP/exlua.luac" test.exlua
          ./src/luac -l "$RUNNER_TEMP/exlua.luac" > "$RUNNER_TEMP/exlua-bytecode.txt"
          ./src/exlua "$RUNNER_TEMP/exlua.luac"
      - name: Check installation
        if: matrix.build == 'release'
        run: |
          make install INSTALL_TOP="$RUNNER_TEMP/exlua-install"
          "$RUNNER_TEMP/exlua-install/bin/exlua" test.exlua
          "$RUNNER_TEMP/exlua-install/bin/luex" -v
          make uninstall INSTALL_TOP="$RUNNER_TEMP/exlua-install"
          test ! -e "$RUNNER_TEMP/exlua-install/bin/exlua"
          test ! -e "$RUNNER_TEMP/exlua-install/bin/luex"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build MinGW executables
        run: make -j2 mingw MYCFLAGS="-DLUAI_ASSERT"
      - name: Run regressions and examples
        run: ./src/exlua.exe tests/run.lua
      - name: Check stripped bytecode and disassembly
        run: |
          ./src/luac.exe -s -o test.exluac test.exlua
          ./src/luac.exe -l test.exluac > /dev/null
          ./src/exlua.exe test.exluac
